# BerlinMOD-Q5 — windowed form (FULL)
# "Pairs of vehicles meeting near P." Per-10s tumbling window over the events
# pre-filtered by upstream edwithin_tgeo_geo to the near-P set; PAIR_MEETING
# emits the per-window meeting pairs (vid_a, vid_b, ts, "<=dMeet" tag) with
# dMeet = 200 m passed as the explicit fifth aggregation argument.

query: |
  SELECT start,
         end,
         PAIR_MEETING(gps_lon, gps_lat, time_utc, vehicle_id, 200.0) AS meeting_pairs
  FROM berlinmod_stream
  WHERE edwithin_tgeo_geo(gps_lon,
                          gps_lat,
                          time_utc,
                          'SRID=4326;POINT(4.3517 50.8503)',
                          FLOAT64(2000.0)) = INT32(1)
  WINDOW TUMBLING(time_utc, SIZE 10 SEC)
  INTO file_sink;

sinks:
  - name: FILE_SINK
    type: File
    schema:
      - { name: BERLINMOD_STREAM$START,         type: UINT64 }
      - { name: BERLINMOD_STREAM$END,           type: UINT64 }
      - { name: BERLINMOD_STREAM$MEETING_PAIRS, type: VARSIZED }
    config:
      file_path: "/workspace/Output/output_berlinmod_q5_windowed.csv"
      input_format: CSV

logical:
  - name: BERLINMOD_STREAM
    schema:
      - { name: TIME_UTC,   type: UINT64 }
      - { name: VEHICLE_ID, type: UINT64 }
      - { name: GPS_LON,    type: FLOAT64 }
      - { name: GPS_LAT,    type: FLOAT64 }

physical:
  - logical: BERLINMOD_STREAM
    type: TCP
    parser_config:
      type: CSV
      field_delimiter: ","
      tuple_delimiter: "\n"
    source_config:
      socket_host: "host.docker.internal"
      socket_port: "32325"
      socket_type: "SOCK_STREAM"
      socket_domain: "AF_INET"
