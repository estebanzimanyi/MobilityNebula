# BerlinMOD-Q9 — continuous form (FULL)
# "Distance between vehicles X (= 100) and Y (= 200) at time T." Per-second
# sliding window. CROSS_DISTANCE picks the latest known position of each
# target vehicle (VID_A = 100, VID_B = 200 hardcoded for the scaffold) inside
# the window and returns the spheroidal distance between them in metres.
# Returns NaN if either vehicle has no observation in the window.

query: |
  SELECT start,
         end,
         CROSS_DISTANCE(gps_lon, gps_lat, time_utc, vehicle_id) AS distance_metres
  FROM berlinmod_stream
  WINDOW SLIDING(time_utc, SIZE 1 SEC, ADVANCE BY 1 SEC)
  INTO file_sink;

sinks:
  - name: FILE_SINK
    type: File
    schema:
      - { name: BERLINMOD_STREAM$START,           type: UINT64 }
      - { name: BERLINMOD_STREAM$END,             type: UINT64 }
      - { name: BERLINMOD_STREAM$DISTANCE_METRES, type: FLOAT64 }
    config:
      file_path: "/workspace/Output/output_berlinmod_q9_continuous.csv"
      input_format: CSV

logical:
  - name: BERLINMOD_STREAM
    schema:
      - { name: TIME_UTC,   type: UINT64 }
      - { name: VEHICLE_ID, type: UINT64 }
      - { name: GPS_LON,    type: FLOAT64 }
      - { name: GPS_LAT,    type: FLOAT64 }

physical:
  - logical: BERLINMOD_STREAM
    type: TCP
    parser_config:
      type: CSV
      field_delimiter: ","
      tuple_delimiter: "\n"
    source_config:
      socket_host: "host.docker.internal"
      socket_port: "32325"
      socket_type: "SOCK_STREAM"
      socket_domain: "AF_INET"
