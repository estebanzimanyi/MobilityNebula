# BerlinMOD-Q6 — windowed form (FULL)
# "Cumulative distance travelled per vehicle." Per-10s tumbling window
# aggregates each vehicle's GPS samples and emits the spheroidal length in
# metres of the per-(window, vehicle) trajectory directly via the
# TEMPORAL_LENGTH aggregation.

query: |
  SELECT start,
         end,
         vehicle_id,
         TEMPORAL_LENGTH(gps_lon, gps_lat, time_utc) AS cumulative_distance
  FROM berlinmod_stream
  GROUP BY vehicle_id
  WINDOW TUMBLING(time_utc, SIZE 10 SEC)
  INTO file_sink;

sinks:
  - name: FILE_SINK
    type: File
    schema:
      - { name: BERLINMOD_STREAM$START,               type: UINT64 }
      - { name: BERLINMOD_STREAM$END,                 type: UINT64 }
      - { name: BERLINMOD_STREAM$VEHICLE_ID,          type: UINT64 }
      - { name: BERLINMOD_STREAM$CUMULATIVE_DISTANCE, type: FLOAT64 }
    config:
      file_path: "/workspace/Output/output_berlinmod_q6_windowed.csv"
      input_format: CSV

logical:
  - name: BERLINMOD_STREAM
    schema:
      - { name: TIME_UTC,   type: UINT64 }
      - { name: VEHICLE_ID, type: UINT64 }
      - { name: GPS_LON,    type: FLOAT64 }
      - { name: GPS_LAT,    type: FLOAT64 }

physical:
  - logical: BERLINMOD_STREAM
    type: TCP
    parser_config:
      type: CSV
      field_delimiter: ","
      tuple_delimiter: "\n"
    source_config:
      socket_host: "host.docker.internal"
      socket_port: "32325"
      socket_type: "SOCK_STREAM"
      socket_domain: "AF_INET"
